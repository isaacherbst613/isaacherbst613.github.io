<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Street Snake: classic Snake as a giant python on the real streets of Manhattan, Paris, Chicago, San Francisco, your own town, or any address you type. A three.js game by Isaac Herbst.">
<link rel="icon" type="image/png" sizes="32x32" href="items/favicon_new/favicon-32x32.png">
<title>Street Snake</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.176.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/",

<style>

         padding: 10px 14px; border-radius: 8px; font-size: 15px; line-height: 1.5; min-width: 170px; }
  #hud b { color: #4ade80; }
  #hint { color: #fbbf24; min-height: 1.5em; }
  #mini { position: absolute; right: 12px; bottom: 28px; z-index: 10; background: rgba(17,17,17,.8);
          border: 2px solid #facc15; border-radius: 8px; }
  #credit { position: absolute; right: 12px; bottom: 6px; z-index: 10; font-size: 11px; color: #fff; text-shadow: 0 0 3px #000; }
  #credit a { color: #fff; }
  #back { position: absolute; top: 12px; right: 12px; z-index: 10; color: #fff; background: rgba(17,17,17,.8); padding: 8px 12px; border-radius: 8px; font-size: 14px; text-decoration: none; }
  #back:hover { background: rgba(17,17,17,.95); }

         border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 330px; }

             font-size: 18px; line-height: 1.6; max-width: 430px; }

</style>

<body>
<canvas id="c"></canvas>
<div id="hud">
  Score <b id="score">0</b><br>
  Length <b id="len">0</b> m<br>

</div>

  Scenery: <b id="scnMode">Stylized</b> &middot; <a href="#" id="scnSwitch">Use Google 3D Tiles</a> <a href="#" id="scnForget" hidden>&middot; Forget key</a>
  <form id="keyForm" hidden>Enter the access code, or paste your own Google Maps API key (Map Tiles API enabled). It stays in this browser.<br>
    <input id="keyIn" type="password" placeholder="Access code or API key" autocomplete="off"><button>Unlock</button></form>
  <div id="scnMsg"></div>
</div>
<div id="msg"><div id="msgText"></div></div>
<script type="module">
import * as THREE from 'three';

import { PRESETS, makeProj, loadPreset, loadCustom, geocode } from './street-snake-world.js';
import { unlockKey } from './street-snake-key.js';

// Street, building and tree data: © OpenStreetMap contributors (ODbL).
// The world is a pre-baked preset (worlds/<id>.json) or any address, downloaded from OpenStreetMap when the page loads.
const store = {
  get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch { /* storage blocked */ } },
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let loc; try { loc = JSON.parse(store.get('snakeLoc')); } catch { loc = null; }
loc = loc && (loc.id || loc.custom) ? loc : { id: PRESETS[0].id };
let world, locError = '';
try { locError = sessionStorage.getItem('snakeLocError') || ''; sessionStorage.removeItem('snakeLocError'); } catch { /* ignore */ }
try {
  if (loc.custom) {
    const key = 'snakeWorld:' + loc.custom.lat.toFixed(4) + ',' + loc.custom.lon.toFixed(4);
    try { world = JSON.parse(sessionStorage.getItem(key)); } catch { world = null; }
    if (!world) {
      document.getElementById('loadCancel').hidden = false;
      document.getElementById('loadCancel').onclick = () => { store.set('snakeLoc', null); location.reload(); };
      world = await loadCustom(loc.custom, m => { document.getElementById('loadMsg').textContent = m; });
      try { sessionStorage.setItem(key, JSON.stringify(world)); } catch { /* too big to cache */ }
    }
  } else world = await loadPreset(loc.id);
  if (world.w.length < 8) throw new Error('too few streets there');
} catch (err) {
  locError = `Could not load ${loc.custom ? loc.custom.name : 'that place'} (${err.message || err}). Showing ${PRESETS[0].name} instead.`;
  store.set('snakeLoc', null);
  world = await loadPreset(PRESETS[0].id);
}
document.getElementById('loading').remove();
const DATA = { n: world.n, w: world.w }, FIELD = world.field, SCENE = { b: world.b, w: world.wt, t: world.t }, WORLD_NAME = world.name;

// ---- Tuning knobs ----
const START_SPEED = 50, MIN_SPEED = 10, MAX_SPEED = 200, ACCEL = 70;   // m/s, m/s² while Up/Down is held
const START_LEN = 80, GROW = 35;                              // m
const turnWindow = () => Math.max(30, speed * 0.6);         // m before an intersection where a key press counts
const STRAIGHT_TOL = 35, TURN_TOL = 50;                       // degrees
const EAT_RADIUS = 14;                                        // m
const R = 3;                                                  // snake body radius (m)
const CAM_BACK = 30, CAM_H = 12, CAM_FOV = 68;                // chase camera: m behind head, m above ground
const ARROW_H = 17, ARROW_AHEAD = 34;                         // floating food arrow: height, distance ahead of head (m)

// ---- Local flat projection (meters) ----
const { lat0, lon0, PHI, KX, KY, toXY } = makeProj(FIELD);
const inField = ([lat, lon]) => lat > FIELD.s && lat < FIELD.n && lon > FIELD.w && lon < FIELD.e;
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
const dst = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const bearing = (a, b) => (Math.atan2(b[0] - a[0], b[1] - a[1]) * 180 / Math.PI + 360) % 360;
const angDiff = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };
const clamp01 = v => Math.max(0, Math.min(1, v));
const RAD = Math.PI / 180;
const $ = id => document.getElementById(id);

// ---- Build street graph: nodes = intersections / ends, edges = street polylines between them ----
// Ways are clipped to the field; streets leaving the field become dead ends.
const runs = [];
for (const ids of DATA.w) {
  let r = [];
  for (const id of ids) {
    if (inField(DATA.n[id])) r.push(id);
    else { if (r.length > 1) runs.push(r); r = []; }
  }
  if (r.length > 1) runs.push(r);
}
const uses = {};
for (const r of runs) for (const id of r) uses[id] = (uses[id] || 0) + 1;
const nodes = {}, edges = [];
const node = id => nodes[id] ||= { id, p: toXY(DATA.n[id]), out: [] };
for (const r of runs) {
  let start = 0;
  for (let i = 1; i < r.length; i++) {
    if (i < r.length - 1 && uses[r[i]] < 2) continue;
    const ids = r.slice(start, i + 1), pts = ids.map(id => toXY(DATA.n[id])), cum = [0];
    for (let k = 1; k < pts.length; k++) cum.push(cum[k - 1] + dst(pts[k - 1], pts[k]));
    start = i;
    if (cum.at(-1) < 1) continue;
    const e = { a: node(ids[0]), b: node(ids.at(-1)), pts, cum, len: cum.at(-1) };
    edges.push(e);
    e.a.out.push({ e, fwd: true });
    e.b.out.push({ e, fwd: false });
  }
}
// Keep only the largest connected piece of the network.
let board = [];
{
  const seen = new Set();
  for (const n of Object.values(nodes)) {
    if (seen.has(n)) continue;
    const comp = [], stack = [n]; seen.add(n);
    while (stack.length) {
      const c = stack.pop(); comp.push(c);
      for (const { e } of c.out) for (const m of [e.a, e.b]) if (!seen.has(m)) { seen.add(m); stack.push(m); }
    }
    if (comp.length > board.length) board = comp;
  }
}
const boardEdges = [...new Set(board.flatMap(n => n.out.map(o => o.e)))];
// Food only goes on streets you can leave without reversing: strip dead-end branches by
// repeatedly removing degree-1 nodes (what's left is the graph's 2-core).
const deadEdges = new Set();
{
  const deg = new Map(board.map(n => [n, n.out.length]));
  const stack = board.filter(n => deg.get(n) === 1);
  while (stack.length) {
    const n = stack.pop();
    for (const { e } of n.out) {
      if (deadEdges.has(e)) continue;
      deadEdges.add(e);
      for (const m of [e.a, e.b]) if (m !== n && deg.set(m, deg.get(m) - 1).get(m) === 1) stack.push(m);
    }
  }
}
const foodEdges = boardEdges.filter(e => !deadEdges.has(e));
const foodLen = foodEdges.reduce((t, e) => t + e.len, 0);
if (foodLen < 400) {   // every street here is a dead-end branch: nowhere to put food that you can drive away from
  store.set('snakeLoc', null);
  try { sessionStorage.setItem('snakeLocError', `${WORLD_NAME} has no loops of road (every street is a dead end), so there is nowhere to hunt. Showing ${PRESETS[0].name} instead.`); } catch { /* ignore */ }
  location.reload(); await new Promise(() => {});
}

// Geometry along a directed edge
const endNode = c => c.fwd ? c.e.b : c.e.a;
function pointAt(c, s) {
  const e = c.e, d = c.fwd ? s : e.len - s;
  let i = 1;
  while (i < e.cum.length - 1 && e.cum[i] < d) i++;
  const seg = e.cum[i] - e.cum[i - 1] || 1;
  return lerp(e.pts[i - 1], e.pts[i], clamp01((d - e.cum[i - 1]) / seg));
}
const leaveBearing = c => bearing(pointAt(c, 0), pointAt(c, Math.min(15, c.e.len)));
const arriveBearing = c => bearing(pointAt(c, Math.max(0, c.e.len - 15)), pointAt(c, c.e.len));
const isReverse = (o, c) => o.e === c.e && o.fwd !== c.fwd;
// Plain bends (2 streets meeting) aren't decisions; walk through them to the next real intersection / dead end.
function nextDecision() {
  let c = cur, r = cur.e.len - s;
  for (let k = 0; k < 50; k++) {
    const n = endNode(c);
    if (n.out.length !== 2) return { n, r };
    c = n.out.find(o => !isReverse(o, c)) || n.out[0];
    r += c.e.len;
  }
  return { n: endNode(c), r };
}

// =====================================================================================
// 3D world (three.js). Units: meters, x east, y north, z up.
// To swap in Google Photorealistic 3D Tiles later: replace the "Scenery" block with a tiles renderer.
// =====================================================================================
const renderer = new THREE.WebGLRenderer({ canvas: $('c'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog('#d9e8f3', 200, 1500);
const cam = new THREE.PerspectiveCamera(CAM_FOV, 1, 0.5, 4000); cam.up.set(0, 0, 1);
let tiles = null;   // Google 3D Tiles renderer when that scenery is on
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
  if (tiles) tiles.setResolutionFromRenderer(cam, renderer);
}
resize(); addEventListener('resize', resize);

const canvasTex = (w, h, draw, repeat, data) => {   // data = true for non-color maps (bump)
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8;
  if (!data) t.colorSpace = THREE.SRGBColorSpace;
  if (repeat) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
};
// Deterministic random so the town looks the same every load.
let seed = 12345;
const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
const speckle = (g, w, h, n, colors, size = 2) => { for (let i = 0; i < n; i++) { g.fillStyle = colors[i % colors.length]; g.fillRect(Math.random() * w, Math.random() * h, size, size); } };

scene.background = canvasTex(4, 256, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h);
  gr.addColorStop(0, '#4f8fd6'); gr.addColorStop(0.45, '#a9cdee'); gr.addColorStop(0.62, '#d9e8f3'); gr.addColorStop(1, '#d9e8f3');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});
scene.add(new THREE.HemisphereLight('#ffffff', '#8a7a5a', 2.3));
const sun = new THREE.DirectionalLight('#fff1d6', 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0006;
Object.assign(sun.shadow.camera, { left: -170, right: 170, top: 170, bottom: -170, near: 1, far: 900 });
scene.add(sun, sun.target);

const std = (o) => new THREE.MeshStandardMaterial({ roughness: 0.85, ...o });
const flat = (o, off) => std({ polygonOffset: true, polygonOffsetFactor: -off, polygonOffsetUnits: -off, ...o });
const SPHERE = new THREE.SphereGeometry(1, 28, 18);
const blob = (m, sx, sy, sz, x, y, z) => { const o = new THREE.Mesh(SPHERE, m); o.scale.set(sx, sy, sz); o.position.set(x, y, z); o.castShadow = true; return o; };

// ---------------------------------- Scenery ----------------------------------
const sceneryG = new THREE.Group(), markersG = new THREE.Group(); scene.add(sceneryG, markersG);   // stylized town / wall + barriers
const corners = [[FIELD.s, FIELD.w], [FIELD.n, FIELD.w], [FIELD.n, FIELD.e], [FIELD.s, FIELD.e]].map(toXY);   // SW, NW, NE, SE
// Ground
let groundMesh, dense = false;   // dense: most of the field is mapped buildings (a city), so no invented houses and a paved ground
{
  const grass = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#6a9a4d'; g.fillRect(0, 0, w, h); speckle(g, w, h, 2500, ['#5f8f45', '#77a658', '#648f49', '#80ad60']); }, true);
  grass.repeat.set(500, 500);
  groundMesh = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), std({ map: grass, roughness: 1 }));
  groundMesh.receiveShadow = true; sceneryG.add(groundMesh);
}
// Flat ribbon along polylines (streets, sidewalks).
function ribbon(lines, halfW, z, vScale) {
  const pos = [], uv = [];
  for (const pts of lines) {
    const L = [], Rr = [], cum = [0];
    for (let i = 0; i < pts.length; i++) {
      const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)], l = dst(a, b) || 1;
      const nx = -(b[1] - a[1]) / l, ny = (b[0] - a[0]) / l;
      L.push([pts[i][0] + nx * halfW, pts[i][1] + ny * halfW]); Rr.push([pts[i][0] - nx * halfW, pts[i][1] - ny * halfW]);
      if (i) cum.push(cum[i - 1] + dst(pts[i - 1], pts[i]));
    }
    for (let i = 0; i < pts.length - 1; i++) {
      const v0 = cum[i] / vScale, v1 = cum[i + 1] / vScale;
      pos.push(...L[i], z, ...Rr[i], z, ...Rr[i + 1], z, ...L[i], z, ...Rr[i + 1], z, ...L[i + 1], z);
      uv.push(0, v0, 1, v0, 1, v1, 0, v0, 1, v1, 0, v1);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.computeVertexNormals();
  return g;
}
{
  const lines = edges.map(e => e.pts);
  const walk = new THREE.Mesh(ribbon(lines, 7.6, 0, 6), flat({ color: '#b7b3a8', roughness: 1 }, 1));
  const asphalt = canvasTex(64, 256, (g, w, h) => {
    g.fillStyle = '#3d4043'; g.fillRect(0, 0, w, h); speckle(g, w, h, 1500, ['#36393c', '#45484b', '#4b4e51'], 1);
    g.fillStyle = '#d9b520'; g.fillRect(30, 0, 1.5, h); g.fillRect(33, 0, 1.5, h);          // double yellow center line
    g.fillStyle = 'rgba(235,235,235,.75)'; g.fillRect(3, 0, 1.5, h); g.fillRect(59.5, 0, 1.5, h); // edge lines
  }, true);
  const road = new THREE.Mesh(ribbon(lines, 5, 0, 14), flat({ map: asphalt, roughness: 0.95 }, 2));
  walk.receiveShadow = road.receiveShadow = true; sceneryG.add(walk, road);
}
// Polygons from the embedded scene data
const polyOf = (arr, from) => { const p = []; for (let i = from; i < arr.length; i += 2) p.push([arr[i] / 10, arr[i + 1] / 10]); return p; };
const areaOf = p => { let a = 0; for (let i = 0; i < p.length; i++) { const q = p[(i + 1) % p.length]; a += p[i][0] * q[1] - q[0] * p[i][1]; } return a / 2; };
const inPoly = (pt, p) => {
  let inside = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++)
    if ((p[i][1] > pt[1]) !== (p[j][1] > pt[1]) && pt[0] < (p[j][0] - p[i][0]) * (pt[1] - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) inside = !inside;
  return inside;
};
const waters = SCENE.w.map(a => polyOf(a, 0));
for (const p of waters) {
  const m = new THREE.Mesh(new THREE.ShapeGeometry(new THREE.Shape(p.map(([x, y]) => new THREE.Vector2(x, y)))),
    flat({ color: '#3f78ad', roughness: 0.15, metalness: 0.2 }, 1));
  m.receiveShadow = true; sceneryG.add(m);
}
// Distance from a point to the nearest street centerline.
const segDist = (p, a, b) => { const l2 = (b[0] - a[0]) ** 2 + (b[1] - a[1]) ** 2 || 1; return dst(p, lerp(a, b, clamp01(((p[0] - a[0]) * (b[0] - a[0]) + (p[1] - a[1]) * (b[1] - a[1])) / l2))); };
const streetDist = p => { let m = 1e9; for (const e of edges) for (let i = 1; i < e.pts.length; i++) m = Math.min(m, segDist(p, e.pts[i - 1], e.pts[i])); return m; };
// Houses: real mapped footprints where OpenStreetMap has them, generated houses along the streets elsewhere (suburbs only).
// Windowed walls; pitched (gable) roofs on generated houses, hip roofs on small mapped ones, flat roofs on big ones.
const buildings = [];
{
  for (const b of SCENE.b) {
    let p = polyOf(b, 1), A = areaOf(p);
    if (A < 0) { p.reverse(); A = -A; }
    if (A < 12 || p.length < 3) continue;
    let cx = 0, cy = 0; for (const q of p) { cx += q[0] / p.length; cy += q[1] / p.length; }
    buildings.push({ c: [cx, cy], rad: Math.max(...p.map(q => dst(q, [cx, cy]))), p, A, lv: b[0] });
  }
  dense = buildings.reduce((s, B) => s + B.A, 0) / (Math.abs(corners[2][0] - corners[0][0]) * Math.abs(corners[2][1] - corners[0][1])) > 0.2;
  if (dense) {
    const paving = canvasTex(128, 128, (g, w, h) => { g.fillStyle = '#8b8a84'; g.fillRect(0, 0, w, h); speckle(g, w, h, 2500, ['#827f79', '#94928b', '#7c7a74', '#9a978f']); }, true);
    paving.repeat.set(500, 500); groundMesh.material.map = paving; groundMesh.material.needsUpdate = true;
  }
  const [x0, y0] = corners[0], [x1, y1] = corners[2];
  if (!dense) for (const e of edges) for (let d = 15 + rnd() * 8; d < e.len - 15; d += 17 + rnd() * 9) {
    const c = { e, fwd: true }, a = pointAt(c, d - 1), b = pointAt(c, d + 1), l = dst(a, b) || 1;
    const tx = (b[0] - a[0]) / l, ty = (b[1] - a[1]) / l, nx = -ty, ny = tx;
    for (const side of [-1, 1]) {
      if (rnd() < 0.1) continue;
      const set = 17 + rnd() * 5, w = 9 + rnd() * 4.5, dp = 8 + rnd() * 4, rad = Math.hypot(w, dp) / 2;
      const ctr = [a[0] + nx * set * side, a[1] + ny * set * side];
      if (ctr[0] < x0 + 8 || ctr[0] > x1 - 8 || ctr[1] < y0 + 8 || ctr[1] > y1 - 8) continue;

  else if (state === 'ready') {                       // title screen: slow fly-around above the start
    const a = now / 9000, h = pointAt(cur, s);
    if (tiles) { const g0 = groundInit(); if (g0 !== null) { gz = startZ = g0; trail[0].z = g0; markersG.position.z = g0; } }   // wait for the real ground
    const rr = dense ? 230 : 140, hh = dense ? 190 : 70;   // higher in a city so the towers don't block the view
    cam.position.set(h[0] + Math.sin(a) * rr, h[1] - Math.cos(a) * rr, hh + gz); cam.lookAt(h[0], h[1], gz);
  }
  render(dt);
  requestAnimationFrame(frame);
}
reset();
show(`<h1>Street Snake</h1>${esc(WORLD_NAME)}, at street level. Steer with <b>&larr;</b> / <b>&rarr;</b> (or A / D): left and right are relative to the snake.<br>
Hold <b>&uarr;</b> / <b>&darr;</b> (or W / S) to speed up or slow down.<br>
Turns only count <b>close to an intersection</b> (the ring turns green).<br>
No key: you go straight. No street ahead, dead ends (red barriers), the striped wall and your own body are fatal.<br>
Hunt the mice: follow the floating arrow, the orange light beam, or the minimap.<br><br>
Press <b>Space</b> to start &middot; <b>P</b> to pause`);
requestAnimationFrame(frame);
</script>
