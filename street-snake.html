  tr.registerPlugin(new GLTFExtensionsPlugin({ dracoLoader: new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.176.0/examples/jsm/libs/draco/gltf/') }));
  // Tiles are in earth-centered coordinates; move them into the game's frame (origin = field center, x east, y north, z up).
  const lam = lon0 * RAD, sp = Math.sin(PHI), cp = Math.cos(PHI), sl = Math.sin(lam), cl = Math.cos(lam);
  const A = 6378137, E2 = 0.00669437999014, N = A / Math.sqrt(1 - E2 * sp * sp);
  const enu = new THREE.Matrix4().makeBasis(new THREE.Vector3(-sl, cl, 0), new THREE.Vector3(-sp * cl, -sp * sl, cp), new THREE.Vector3(cp * cl, cp * sl, sp))
    .setPosition(N * cp * cl, N * cp * sl, N * (1 - E2) * sp);
  tr.group.matrixAutoUpdate = false; tr.group.matrix.copy(enu).invert(); tr.group.updateMatrixWorld(true);
  tr.setCamera(cam); tr.setResolutionFromRenderer(cam, renderer);
  // The photogrammetry already has its lighting baked in: show it unlit.
  tr.addEventListener('load-model', ({ scene: s }) => s.traverse(o => {
    if (o.isMesh && !o.material.isMeshBasicMaterial) { const m = o.material; o.material = new THREE.MeshBasicMaterial({ map: m.map }); m.dispose(); }
  }));
  tr.addEventListener('load-error', e => { if (!e.tile) googleFailed(e.error); });
  scene.add(tr.group); tiles = tr;
  sceneryG.visible = false; shadowCatcher.visible = true; ringM.depthTest = false;
  $('scnMode').textContent = 'Google 3D Tiles';
  setInterval(() => {          // Google requires its attribution to be shown
    if (!tiles) return;
    const list = []; tiles.getAttributions(list);
    $('gattr').textContent = 'Google · ' + list.filter(x => x.type === 'string').map(x => x.value).join('; ') + ' · ';
  }, 1000);
}
{
  const key = store.get('snakeGoogleKey'), google = store.get('snakeScenery') === 'google' && !!key;
  $('scnSwitch').textContent = google ? 'Switch to stylized' : 'Use Google 3D Tiles';
  $('scnForget').hidden = !key;
  $('scnSwitch').onclick = e => {
    e.preventDefault();
    if (google) { store.set('snakeScenery', 'stylized'); location.reload(); }
    else if (key) { store.set('snakeScenery', 'google'); location.reload(); }
    else { $('keyForm').hidden = false; $('keyIn').focus(); }
  };
  $('scnForget').onclick = e => { e.preventDefault(); store.set('snakeGoogleKey', null); store.set('snakeScenery', null); location.reload(); };
  $('keyForm').onsubmit = e => {
    e.preventDefault();
    const k = $('keyIn').value.trim();
    if (k) { store.set('snakeGoogleKey', k); store.set('snakeScenery', 'google'); location.reload(); }
  };
  if (google) initGoogle(key).catch(googleFailed);
}

// ---- Game state ----
let cur, s, dist, L_, speed, trail, visits, queued, food, score, state = 'ready', hintUntil = 0;
let camB = 0, mouthOpen = 0, gulp = 0;

function placeFood() {
  let r = Math.random() * foodLen;
  for (const e of foodEdges) {
    if ((r -= e.len) > 0) continue;
    const pos = pointAt({ e, fwd: true }, e.len > 30 ? 10 + Math.random() * (e.len - 20) : e.len / 2);
    if (trail.some(t => dst(t.p, pos) < 40)) return placeFood(); // not on top of the snake
    food = pos; setFood();
    return;
  }
}

function reset() {
  // Start on the longest-enough street closest to the center.
  const mid = e => pointAt({ e, fwd: true }, e.len / 2);
  const startEdge = boardEdges.filter(e => e.len > 120).sort((a, b) => dst(mid(a), [0, 0]) - dst(mid(b), [0, 0]))[0];
  cur = { e: startEdge, fwd: true }; s = 0; dist = 0;
  L_ = START_LEN; speed = START_SPEED; score = 0; queued = null; visits = {}; bulges = []; mouthOpen = 0; gulp = 0;
  gz = startZ;
  trail = [{ p: pointAt(cur, 0), d: 0, z: gz }];
  placeFood();
}

function die(why) {
  state = 'dead';
  show(`<h1>Crashed</h1>${why}<br>Score <b>${score}</b> · Length ${Math.round(L_)} m<br><br>Press <b>Space</b> to play again`);
}

// Steering is relative: queued is -90 (left), 0 (straight) or +90 (right) from the arrival heading.
function choose(n) {
  const opts = n.out.filter(o => !isReverse(o, cur));
  if (n.out.length === 2) return opts[0];            // just a bend in the road
  const pick = (target, tol) => {
    let best = null, bd = tol;
    for (const o of opts) { const d = angDiff(leaveBearing(o), target); if (d < bd) { bd = d; best = o; } }
    return best;
  };
  return (queued !== null && pick((arriveBearing(cur) + queued + 360) % 360, TURN_TOL)) || pick(arriveBearing(cur), STRAIGHT_TOL);
}

function step(dt) {
  let d = speed * dt;
  for (let i = 0; i < bulges.length; i++) bulges[i] += 45 * dt;       // meals slide toward the tail
  bulges = bulges.filter(b => b < L_);
  while (d > 0) {
    const rem = cur.e.len - s;
    if (d < rem) { s += d; dist += d; break; }
    s = cur.e.len; dist += rem; d -= rem;
    const n = endNode(cur);
    trail.push({ p: n.p, d: dist, node: true, z: gz });
    if (visits[n.id] !== undefined && dist - visits[n.id] < L_) return die('You ran into yourself.');
    visits[n.id] = dist;
    const decision = n.out.length !== 2;
    const next = choose(n);
    if (!next) return die(n.out.length === 1 ? 'Dead end.' : 'No street that way — straight into a house.');
    if (decision) queued = null;
    cur = next; s = 0;
  }
  const head = pointAt(cur, s), lastT = trail.at(-1);
  if (tiles) gz += (groundAt(head, gz) - gz) * Math.min(1, dt * 8);     // follow the real terrain, smoothed over bumps (parked cars)
  if (trail.length > 1 && !lastT.node && dist - trail.at(-2).d < 4) { lastT.p = head; lastT.d = dist; lastT.z = gz; } // ~4 m spacing
  else trail.push({ p: head, d: dist, z: gz });
  if (dst(head, food) < EAT_RADIUS) {
    score++; L_ += GROW;
    bulges.push(4); gulp = 1;                                          // swallow: jaws snap shut, a bulge starts down the body
    placeFood();
  }
}

// Chase camera: low behind the head, turning smoothly with it.
function chase(dt, snap) {
  const head = pointAt(cur, s);
  const target = cur.e.len - s > 3 ? bearing(head, pointAt(cur, Math.min(cur.e.len, s + 15))) : arriveBearing(cur);
  camB = snap ? target : camB + (((target - camB + 540) % 360) - 180) * Math.min(1, dt * 5);
  const fx = Math.sin(camB * RAD), fy = Math.cos(camB * RAD);
  cam.position.set(head[0] - fx * CAM_BACK, head[1] - fy * CAM_BACK, CAM_H + gz);
  cam.lookAt(head[0] + fx * 45, head[1] + fy * 45, 5 + gz);
}

function render(dt = 0) {
  const tailD = dist - L_, now = performance.now() / 1000;
  while (trail.length > 2 && trail[1].d <= tailD) trail.shift();
  const pts = trail.map(t => [t.p[0], t.p[1], t.z || 0]);   // x, y, ground height
  if (trail.length > 1 && trail[0].d < tailD)
    pts[0] = [...lerp(trail[0].p, trail[1].p, (tailD - trail[0].d) / (trail[1].d - trail[0].d)), trail[0].z || 0];
  const nd = nextDecision(), inWin = nd.r <= turnWindow(), head = pts.at(-1), fd = dst(head, food);
  $('score').textContent = score;
  $('len').textContent = Math.round(L_);
  $('spd').textContent = Math.round(speed * 3.6);
  const labels = { '-90': '↰ left', 0: '↑ straight', 90: '↱ right' };
  $('hint').textContent = performance.now() < hintUntil ? 'too early' : queued !== null ? `turning ${labels[queued]}` : '';
  $('fdist').textContent = `${Math.round(fd)} m`;
  drawMini(pts);

  // Snake body + head
  headLift = mouthOpen * R * 1.0;
  if (pts.length > 1) buildBody(pts, dist - L_); else snakeMesh.geometry.setIndex([]);
  let back = pts[0];
  for (let i = pts.length - 2; i >= 0; i--) if (dst(pts[i], head) >= 8) { back = pts[i]; break; }
  const hb = pts.length > 1 ? bearing(back, head) : leaveBearing(cur), sway = pts.length > 1 ? clamp01((dist - tailD) / 20) : 0;
  const hr = hb * RAD, off = wig(dist) * sway;
  headG.position.set(head[0] - Math.cos(hr) * off, head[1] + Math.sin(hr) * off, head[2] + HB * 0.72 + headLift);
  headG.rotation.z = -hr + Math.atan(WIG_A / WIG_L * Math.cos(dist / WIG_L)) * sway;
  // Mouth: gapes as the mouse gets close and ahead, snaps shut on the swallow.
  const ahead = angDiff(bearing(head, food), hb) < 70;
  gulp = Math.max(0, gulp - dt * 4);
  const want = gulp > 0 ? 0 : state === 'play' && ahead ? clamp01((130 - fd) / 80) : 0;
  mouthOpen += (want - mouthOpen) * Math.min(1, dt * (gulp > 0 ? 30 : 10) + (dt ? 0 : 1));
  upperPivot.rotation.x = mouthOpen * 0.7;
  lowerPivot.rotation.x = -mouthOpen * 0.28 - Math.sin(gulp * Math.PI) * 0.06;
  fangs.scale.setScalar(Math.max(0.02, clamp01(mouthOpen * 2.5)));
  const flick = now % 2.1, out = mouthOpen < 0.15 && flick < 0.5;
  tongue.visible = out || mouthOpen > 0.3;
  tongue.scale.y = out ? 0.75 + 0.35 * Math.sin(flick * 13) : 0.45;
  tongue.rotation.x = out ? 0.12 * Math.sin(flick * 40) : 0;

  // Mouse: sniffs around; when the snake is near it turns to face it and rears up.
  const scared = clamp01((170 - fd) / 60);
  if (scared > 0) mouse.rotation.z += ((((-bearing(food, head) * RAD - mouse.rotation.z) % 6.283) + 9.425) % 6.283 - 3.1416) * Math.min(1, dt * 8);
  else mouse.rotation.z += 0.4 * Math.sin(now * 1.3) * dt;
  mouse.rotation.x = scared * 0.75 + 0.05 * Math.sin(now * 9);
  mouse.position.z = scared * 1.3 + Math.max(0, Math.sin(now * 5)) * 0.25 * (1 - scared);

  // Mouse, ring, markers and shadow surface sit on the local ground
  if (tiles) foodZ = groundAt(food, foodZ);
  foodG.position.z = foodZ; shadowCatcher.position.z = gz + 0.25;
  // Next-intersection ring and the floating arrow
  ring.position.set(nd.n.p[0], nd.n.p[1], gz + (tiles ? 0.8 : 0.25));
  ring.visible = state === 'play'; ringM.color.set(inWin ? '#22c55e' : '#cbd5e1');
  const fx = Math.sin(camB * RAD), fy = Math.cos(camB * RAD);
  arrowTilt.visible = state === 'play' && fd > 70;
  arrowTilt.position.set(head[0] + fx * ARROW_AHEAD, head[1] + fy * ARROW_AHEAD, gz + ARROW_H + 0.8 * Math.sin(now * 3.3));
  arrowTilt.rotation.z = -camB * RAD; arrowTilt.rotation.x = 0.95;
  arrow.rotation.z = -(bearing(head, food) - camB) * RAD;

  // Sun follows the action so shadows stay sharp around the snake.
  sun.position.set(head[0] - 150, head[1] - 220, gz + 320); sun.target.position.set(head[0], head[1], gz);
  if (tiles) { cam.updateMatrixWorld(); tiles.update(); }
  renderer.render(scene, cam);
}

function show(html) { $('msgText').innerHTML = html; $('msg').classList.toggle('hide', !html); }

const KEYS = { ArrowLeft: -90, KeyA: -90, ArrowRight: 90, KeyD: 90 };
const THROTTLE = { ArrowUp: 1, KeyW: 1, ArrowDown: -1, KeyS: -1 }, held = new Set();   // hold to speed up / slow down
addEventListener('keyup', ev => held.delete(ev.code));
addEventListener('blur', () => held.clear());
addEventListener('keydown', ev => {
  if (ev.target.tagName === 'INPUT') return;          // typing the API key
  if (ev.code === 'Space') {
    ev.preventDefault();
    if (state !== 'play') { if (state === 'dead') reset(); state = 'play'; show(''); last = performance.now(); chase(0, true); }
    return;
  }
  if (ev.code === 'KeyP' && state !== 'dead' && state !== 'ready') {
    state = state === 'play' ? 'paused' : 'play'; show(state === 'paused' ? '<h1>Paused</h1>Press <b>P</b> to resume' : '');
    last = performance.now(); return;
  }
  if (ev.code in THROTTLE) { ev.preventDefault(); held.add(ev.code); return; }
  if (!(ev.code in KEYS)) return;
  ev.preventDefault();
  if (state !== 'play') return;
  if (nextDecision().r <= turnWindow()) queued = KEYS[ev.code];
  else hintUntil = performance.now() + 500;
});

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') {
    for (const k of held) speed = Math.max(MIN_SPEED, Math.min(MAX_SPEED, speed + THROTTLE[k] * ACCEL * dt));
    step(dt); chase(dt);
  }
  else if (state === 'ready') {                       // title screen: slow fly-around above the start
    const a = now / 9000, h = pointAt(cur, s);
    if (tiles) { const g0 = groundInit(); if (g0 !== null) { gz = startZ = g0; trail[0].z = g0; markersG.position.z = g0; } }   // wait for the real ground
    cam.position.set(h[0] + Math.sin(a) * 140, h[1] - Math.cos(a) * 140, 70 + gz); cam.lookAt(h[0], h[1], gz);
  }
  render(dt);
  requestAnimationFrame(frame);
}
reset();
show(`<h1>Street Snake</h1>Downtown Lakewood, at street level. Steer with <b>&larr;</b> / <b>&rarr;</b> (or A / D): left and right are relative to the snake.<br>
Hold <b>&uarr;</b> / <b>&darr;</b> (or W / S) to speed up or slow down.<br>
Turns only count <b>close to an intersection</b> (the ring turns green).<br>
No key: you go straight. No street ahead, dead ends (red barriers), the striped wall and your own body are fatal.<br>
Hunt the mice: follow the floating arrow, the orange light beam, or the minimap.<br><br>
Press <b>Space</b> to start &middot; <b>P</b> to pause`);
requestAnimationFrame(frame);
</script>
</body>
</html>
